
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plantlab-api
  namespace: plantlab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: plantlab-api
  template:
    metadata:
      labels:
        app: plantlab-api
    spec:
      containers:
        - name: api
          image: hinrikk/plantlab-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: DATABASE_URL
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: plantlab-api
  namespace: plantlab
spec:
  selector:
    app: plantlab-api
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
