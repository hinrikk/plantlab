apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-actions
  namespace: plantlab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-actions-deployer
  namespace: plantlab
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["plantlab-api"]
    verbs: ["get", "patch"]

  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-actions-deployer
  namespace: plantlab
subjects:
  - kind: ServiceAccount
    name: github-actions
    namespace: plantlab
roleRef:
  kind: Role
  name: github-actions-deployer
  apiGroup: rbac.authorization.k8s.io